[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-grabber"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiohttp>=3.11",
    "aiosqlite>=0.21",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["grabber*"]
